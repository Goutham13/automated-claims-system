name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "policy_terms.json"
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0834637095
  REGION: us-central1
  SERVICE: plum-claims-api
  REGISTRY: us-central1-docker.pkg.dev/gen-lang-client-0834637095/plum-claims
  CLOUDSQL_INSTANCE: gen-lang-client-0834637095:us-central1:claims-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            -f api/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.SERVICE }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.SERVICE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 2Gi \
            --cpu 2 \
            --max-instances 10 \
            --set-env-vars GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_LOCATION=global \
            --set-secrets DATABASE_URL=DATABASE_URL:latest \
            --add-cloudsql-instances ${{ env.CLOUDSQL_INSTANCE }}

      - name: Print service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'
